# One command: `docker compose up -d --build` → http://localhost:8080
#
# Start the backend first (its repository: `docker compose up -d --build`): this container joins the backend's
# `arm-net` network and forwards /api to it as `api:8080`.
#
# Optional settings, in a .env file next to this one:
#   WEB_HOST_PORT=8080       host port of the web app
#   BIND_ADDRESS=0.0.0.0     also reachable from the LAN (phones following a screen's QR code)
#   ALLOWED_HOSTS=arm.example.com   when the app is opened under a domain name (behind your own web server)
name: arm-web

services:
  web:
    build: .
    image: arm-web:local
    environment:
      API_PROXY_TARGET: http://api:8080
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
    ports:
      - target: 8080
        published: ${WEB_HOST_PORT:-8080}
        host_ip: ${BIND_ADDRESS:-127.0.0.1}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - arm-net
    restart: unless-stopped

networks:
  arm-net:
    name: arm-net
    external: true
