# Production (the VPS): the published image, started by the deploy job of .github/workflows/ci.yml.
#   WEB_IMAGE      ghcr.io/<owner>/<repo>@sha256:...   (set by the deploy job)
#   SITE_ADDRESS   a domain name pointing at the server (automatic HTTPS from Let's Encrypt), or unset for
#                  plain HTTP on the server's IP address; kept in /opt/arm/web/.env on the server
#   HTTP_PORT, HTTPS_PORT   host ports (default 80 and 443)
# The backend stack must be running: Caddy forwards /api to `api:8080` on the `arm-edge` network.
name: arm-web

services:
  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      API_UPSTREAM: api:8080
    ports:
      - target: 80
        published: ${HTTP_PORT:-80}
        host_ip: ${BIND_ADDRESS:-0.0.0.0}
      - target: 443
        published: ${HTTPS_PORT:-443}
        host_ip: ${BIND_ADDRESS:-0.0.0.0}
    volumes:
      # Certificates and Caddy's state survive restarts and redeploys.
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:

networks:
  edge:
    name: arm-edge
    external: true
