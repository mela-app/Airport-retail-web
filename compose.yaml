
services:
  mela-web:
    # `image` + `build` together means `docker compose build` tags the local
    # image with this name, while the deploy host can `docker compose pull`
    # the exact artifact CD pushed to GHCR.
    image: ghcr.io/${REPO_OWNER:-mela-app}/airport-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Default is 8081, not 8080, so it can coexist with another stack on the
      # same host. The reverse proxy for guzo.elshadayet.com forwards here.
      - '${WEB_PORT:-8081}:80'
    restart: unless-stopped
