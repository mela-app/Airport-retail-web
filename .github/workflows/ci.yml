# CI/CD for the frontend.
#
#   pull request / any push   verify (build, typecheck, lint, format, tests) and security (Trivy + OpenGrep)
#   push to main              + image: build and push ghcr.io/<owner>/<repo>:<commit> (and :latest)
#                             + deploy: run that image (pinned by digest) on the VPS over SSH
#
# Deploy is skipped until the repository has the variables VPS_HOST and VPS_USER and the secrets VPS_SSH_KEY and
# VPS_KNOWN_HOSTS (see docs/deployment.md). It runs in the "production" environment, so protection rules such as
# required reviewers can be added there.
name: CI
on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# Least privilege by default; jobs that publish or deploy ask for more.
permissions:
  contents: read

jobs:
  ci:
    name: Build, Test & Format
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to full commit SHAs (immutable); the release tag is noted for upgrades.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # pnpm must be installed before setup-node, which uses it for `cache: pnpm` (version from package.json).
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
